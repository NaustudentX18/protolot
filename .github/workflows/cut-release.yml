name: Cut tagged release

on:
  push:
    paths:
      - ".release-request"

jobs:
  cut-release:
    name: assembleDebug + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tip
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read .release-request
        id: req
        run: |
          TAG=$(sed -n '1p' .release-request | tr -d '[:space:]')
          SHA=$(sed -n '2p' .release-request | tr -d '[:space:]')
          if [ -z "$SHA" ]; then SHA="$GITHUB_SHA"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Cutting $TAG @ $SHA"

      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk "release-assets/protolot-${{ steps.req.outputs.tag }}.apk"
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.req.outputs.tag }}
          target_commitish: ${{ steps.req.outputs.sha }}
          name: Protolot ${{ steps.req.outputs.tag }}
          body: |
            Protolot ${{ steps.req.outputs.tag }} sideload build.
            - applicationId: `app.protolot.build`
            - Target: `${{ steps.req.outputs.sha }}`
            - Install: `adb install -r` the attached APK
          files: release-assets/protolot-${{ steps.req.outputs.tag }}.apk
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
