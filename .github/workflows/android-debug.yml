name: Android debug APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  assemble-debug:
    name: assembleDebug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: protolot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/protolot-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/protolot-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cut-release:
    name: cut-release (.release-request)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check .release-request
        id: req
        run: |
          if [ -f .release-request ]; then
            TAG=$(tr -d '[:space:]' < .release-request)
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.req.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.req.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        if: steps.req.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        if: steps.req.outputs.present == 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Tag and release
        if: steps.req.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.req.outputs.tag }}
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/protolot-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping create"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          gh release create "$TAG" release-assets/protolot-debug.apk \
            --title "$TAG" --generate-notes || \
            gh release upload "$TAG" release-assets/protolot-debug.apk --clobber
